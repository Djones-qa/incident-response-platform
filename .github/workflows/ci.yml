name: CI

on:
  push:
    branches: ["master", "main", "develop"]
  pull_request:
    branches: ["master", "main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: TypeScript typecheck + build
  # ─────────────────────────────────────────────
  typecheck-build:
    name: Typecheck & Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - alert-receiver
          - runbook-executor
          - postmortem-generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        working-directory: ${{ matrix.service }}
        run: npm run typecheck

      - name: Build
        working-directory: ${{ matrix.service }}
        run: npm run build

  # ─────────────────────────────────────────────
  # Job 2: Unit tests
  # ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: typecheck-build
    strategy:
      fail-fast: false
      matrix:
        service:
          - alert-receiver
          - runbook-executor
          - postmortem-generator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: npm run test:ci

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # Job 3: Trivy vulnerability scan
  # ─────────────────────────────────────────────
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    needs: typecheck-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan alert-receiver Dockerfile
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: "config"
          scan-ref: "alert-receiver/Dockerfile"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Scan runbook-executor Dockerfile
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: "config"
          scan-ref: "runbook-executor/Dockerfile"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Scan postmortem-generator Dockerfile
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: "config"
          scan-ref: "postmortem-generator/Dockerfile"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Scan Kubernetes manifests
        uses: aquasecurity/trivy-action@0.18.0
        with:
          scan-type: "config"
          scan-ref: "k8s/"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  # ─────────────────────────────────────────────
  # Job 4: kubeconform — validate K8s manifests
  # ─────────────────────────────────────────────
  kubeconform:
    name: Kubeconform (K8s 1.28)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: |
          kubeconform \
            -kubernetes-version 1.28.0 \
            -strict \
            -summary \
            -output pretty \
            k8s/*.yaml
