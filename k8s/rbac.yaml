# Service account for alert-receiver (no K8s API access needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-receiver
  namespace: incident-platform
  labels:
    app: alert-receiver
automountServiceAccountToken: false
---
# Service account for runbook-executor (needs K8s API access)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runbook-executor
  namespace: incident-platform
  labels:
    app: runbook-executor
automountServiceAccountToken: true
---
# Service account for postmortem-generator (no K8s API access needed)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postmortem-generator
  namespace: incident-platform
  labels:
    app: postmortem-generator
automountServiceAccountToken: false
---
# Role for runbook-executor — least privilege for runbook actions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: runbook-executor-role
  labels:
    app: runbook-executor
rules:
  # Pod operations: list, get, delete (restart), evict
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
  # Deployment operations: get, list, patch (scale, rollback)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  # Node operations: get, patch (cordon/drain)
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
# Bind the role to the runbook-executor service account
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: runbook-executor-binding
  labels:
    app: runbook-executor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: runbook-executor-role
subjects:
  - kind: ServiceAccount
    name: runbook-executor
    namespace: incident-platform
