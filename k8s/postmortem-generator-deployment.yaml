apiVersion: apps/v1
kind: Deployment
metadata:
  name: postmortem-generator
  namespace: incident-platform
  labels:
    app: postmortem-generator
    app.kubernetes.io/part-of: incident-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postmortem-generator
  template:
    metadata:
      labels:
        app: postmortem-generator
        app.kubernetes.io/part-of: incident-platform
    spec:
      serviceAccountName: postmortem-generator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postmortem-generator
          image: djones-qa/postmortem-generator:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
              protocol: TCP
          env:
            - name: PORT
              value: "3002"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postmortem-generator
  namespace: incident-platform
  labels:
    app: postmortem-generator
spec:
  selector:
    app: postmortem-generator
  ports:
    - port: 3002
      targetPort: 3002
      protocol: TCP
  type: ClusterIP
