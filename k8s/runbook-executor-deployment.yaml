apiVersion: apps/v1
kind: Deployment
metadata:
  name: runbook-executor
  namespace: incident-platform
  labels:
    app: runbook-executor
    app.kubernetes.io/part-of: incident-platform
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: runbook-executor
  template:
    metadata:
      labels:
        app: runbook-executor
        app.kubernetes.io/part-of: incident-platform
    spec:
      serviceAccountName: runbook-executor
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runbook-executor
          image: djones-qa/runbook-executor:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: DRY_RUN
              value: "false"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: runbook-executor
  namespace: incident-platform
  labels:
    app: runbook-executor
spec:
  selector:
    app: runbook-executor
  ports:
    - port: 3001
      targetPort: 3001
      protocol: TCP
  type: ClusterIP
